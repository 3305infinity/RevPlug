services:
  postgres:
    image: postgres:16.10-alpine
    environment:
      POSTGRES_DB: recovery_engine
      POSTGRES_USER: recovery
      POSTGRES_PASSWORD: recovery_dev_password
    ports:
      - "5432:5432"
    volumes:
      - recovery_engine_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recovery -d recovery_engine"]
      interval: 2s
      timeout: 2s
      retries: 15

volumes:
  recovery_engine_data:
