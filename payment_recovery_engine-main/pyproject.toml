[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "payment-recovery-engine"
version = "0.1.0"
description = "Deterministic payment failure classification and recovery policy engine"
requires-python = ">=3.11,<3.12"
dependencies = [
  "fastapi==0.141.1",
  "pydantic==2.13.4",
  "uvicorn==0.41.0",
]

[project.optional-dependencies]
dev = [
  "httpx==0.28.1",
  "psycopg[binary]==3.3.3",
  "pytest==9.0.2",
  "ruff==0.15.4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
